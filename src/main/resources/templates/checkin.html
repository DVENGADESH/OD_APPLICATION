<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Permissions-Policy tag is kept as a best practice, but logic is moved to JS function -->
    <meta http-equiv="Permissions-Policy" content="geolocation=self">
    <title>Attendance Check-in</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md text-center">
    <h1 class="text-2xl font-bold mb-4">Attendance Check-in</h1>
    <!-- Status now prompts the user to click the button -->
    <p id="location-status" class="text-gray-600">Click Check In to acquire your location and verify attendance.</p>
    <button id="checkin-button" onclick="handleCheckin()"
            class="mt-4 bg-indigo-600 text-white py-2 px-6 rounded-lg hover:bg-indigo-700 disabled:opacity-50">
        Check In
    </button>
    <p id="message" class="mt-4 text-center font-semibold"></p>
</div>

<script>
    const messageEl = document.getElementById('message');
    const statusEl = document.getElementById('location-status');
    const checkinButton = document.getElementById('checkin-button');

    // Variables to store acquired coordinates
    let acquiredLat = null;
    let acquiredLon = null;

    // Initial state
    checkinButton.disabled = false;

    // Function to extract URL parameters
    function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            token: params.get('token'),
            eventId: params.get('eventId')
        };
    }

    // Main check-in function triggered by button click
    function handleCheckin() {
        checkinButton.disabled = true; // Disable button immediately

        if (!navigator.geolocation) {
            statusEl.textContent = "Geolocation not supported by your browser.";
            return;
        }

        statusEl.textContent = "Requesting location permission...";
        messageEl.textContent = "Please confirm the location access pop-up.";
        messageEl.classList.remove('text-red-600');

        // 1. Acquire Location (triggered by user action)
        navigator.geolocation.getCurrentPosition(
            async (position) => {
                acquiredLat = position.coords.latitude;
                acquiredLon = position.coords.longitude;
                statusEl.textContent = "Location acquired. Verifying attendance...";

                // 2. Send to API immediately after acquiring location
                await sendCheckinRequest();
            },
            (error) => {
                checkinButton.disabled = false; // Re-enable on failure
                statusEl.textContent = "Verification failed.";

                let errorMessage = "Error acquiring location. Please ensure GPS is enabled and allowed for this site.";

                if (error.code === error.PERMISSION_DENIED) {
                    errorMessage = "Access Denied. You must allow location access to check in.";
                } else if (error.message.includes("permissions policy")) {
                    // Custom message for the specific error you're hitting
                    errorMessage = "Error: Browser policy blocking access. Try using a standard browser (Chrome/Firefox) instead of the embedded view.";
                }

                messageEl.textContent = errorMessage;
                messageEl.classList.add('text-red-600');
                console.error("Geolocation Error:", error);
            }
        );
    }

    // 3. Send API Request (Moved to a separate function)
    async function sendCheckinRequest() {
        const params = getUrlParams();

        // Check if coordinates were actually acquired
        if (!acquiredLat || !acquiredLon) {
            messageEl.textContent = "Location data lost during transfer. Please try again.";
            checkinButton.disabled = false;
            return;
        }

        const apiUrl = `/api/events/checkin?token=${params.token}&lat=${acquiredLat}&lon=${acquiredLon}`;

        try {
            const response = await fetch(apiUrl, { method: 'GET' });

            const result = await response.text();
            messageEl.textContent = result;
            checkinButton.style.display = 'none'; // Hide button on final result

            if (response.ok) {
                messageEl.classList.add('text-green-600');
            } else {
                messageEl.classList.add('text-red-600');
                // In case of API failure (e.g., Event not found, link used)
                checkinButton.style.display = 'block'; // Show button again
                checkinButton.disabled = false;
            }
        } catch (error) {
            messageEl.textContent = 'Network error or server failed to respond.';
            messageEl.classList.add('text-red-600');
            checkinButton.disabled = false;
        }
    }
</script>
</body>
</html>
